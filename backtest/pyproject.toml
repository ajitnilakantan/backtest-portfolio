[project]
description = "Backtest a stock portfolio"
name = "backtest-portfolio"
requires-python = ">=3.12"
version = "0.2.2"
dependencies = [
    "altair>=6.2.2",
    "inquirerpy>=0.3.4",
    "ipython>=9.15.0",
    "ipywidgets>=8.1.8",
    "itables>=2.9.1",
    "marimo>=0.23.15",
    "numpy>=2.5.1",
    "pandas>=3.0.2",
    "python-dateutil>=2.9.0.post0",
    "tabulate>=0.10.0",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "itables>=2.9.1",
    "jupyter>=1.1.1",
    "jupyterlab-code-formatter>=3.0.3",
    "jupyterlab>=4.6.2",
    "nbformat>=5.10.4",
    "perspective-python>=4.5.2",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "setuptools>=83.0.0",
    "voici-core>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.deptry]
# To avoid: DEP003 'backtest' imported but it is a transitive dependency
known_first_party = ["backtest-portfolio"]
# To avoid:  DEP004 'pytest' imported but declared as a dev dependency
per_rule_ignores = { DEP004 = ["pytest"] }

[tool.pytest.ini_options]
#pythonpath = ["./src"]
testpaths = ["tests", "marimo_template"]

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
]

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[tool.marimo.package_management]
manager = "uv"

[tool.marimo.server]
browser = "uv run src/open_chromeless_window.py %s"

[tool.marimo.runtime]
pythonpath = ["./src"]
